name: Android build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Check principle 1 — no Google Play Services
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          ./gradlew --no-daemon -q :app:dependencies --configuration debugRuntimeClasspath > deps.txt
          if grep -qE "com\.google\.android\.gms|com\.google\.firebase" deps.txt; then
            echo "::error::Google Play Services / Firebase dependency found (violates principle 1)"
            for dep in $(grep -oE "com\.google\.(android\.gms|firebase):[a-z0-9-]+" deps.txt | sort -u | cut -d: -f2); do
              echo "----- who pulls in $dep:"
              ./gradlew --no-daemon -q :app:dependencyInsight --configuration debugRuntimeClasspath --dependency "$dep" | head -40
            done
            exit 1
          fi
          echo "OK: no Google Play Services dependencies."

      - uses: actions/upload-artifact@v6
        with:
          name: ajnav-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
