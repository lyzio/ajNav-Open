name: Android build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Unit tests (charging planner, prices, weather parser, car profiles)
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest :feature:vehicles:test

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Check principle 1 — no Google Play Services
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          ./gradlew --no-daemon -q :app:dependencies --configuration debugRuntimeClasspath > deps.txt
          # Approved exception (design.md §1.1): Mapbox Common's optional Cronet provider.
          ALLOWED="play-services-cronet|play-services-base|play-services-basement|play-services-tasks"
          grep -E "com\.google\.android\.gms|com\.google\.firebase" deps.txt \
            | grep -vE "com\.google\.android\.gms:($ALLOWED):" > forbidden.txt || true
          if [ -s forbidden.txt ]; then
            cat forbidden.txt
            echo "::error::Google Play Services / Firebase dependency found (violates principle 1)"
            for dep in $(grep -oE "com\.google\.(android\.gms|firebase):[a-z0-9-]+" forbidden.txt | sort -u | cut -d: -f2); do
              echo "----- who pulls in $dep:"
              ./gradlew --no-daemon -q :app:dependencyInsight --configuration debugRuntimeClasspath --dependency "$dep" | head -40
            done
            exit 1
          fi
          echo "OK: no Google Play Services dependencies (apart from the approved Mapbox Cronet exception)."

      - name: Build signed release bundle for Google Play
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_UPLOAD_KEY_ALIAS" ]; then
            echo "::warning::Upload key secrets not set; skipping the Play release bundle."
            exit 0
          fi
          export ANDROID_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$ANDROID_UPLOAD_KEYSTORE"
          ./gradlew --no-daemon --stacktrace :app:bundleRelease
          rm -f "$ANDROID_UPLOAD_KEYSTORE"

      - uses: actions/upload-artifact@v6
        with:
          name: ajnav-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: ajnav-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
